[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "costclaw"
version = "0.1.0"
description = "Official Python client for the CostClaw freight-invoice audit API."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "CostClaw", email = "support@costclaw.ai" }]
keywords = ["costclaw", "freight", "logistics", "invoice", "audit", "api", "client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://costclaw.ai"
Repository = "https://github.com/costclaw-ai/costclaw-lib"
Issues = "https://github.com/costclaw-ai/costclaw-lib/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/costclaw"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# No UP (pyupgrade): this package targets 3.9, so it keeps typing.Union/Dict/List
# for runtime-safe generics rather than the 3.10+ builtin forms.
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
